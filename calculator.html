<!DOCTYPE html>
<html>
<head>
<title>Black Calculator</title>
<style>
    body { background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
    .calc { background: #000; width: 300px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #display { width: 100%; height: 70px; background: #000; color: white; border: none; font-size: 36px; text-align: right; padding: 10px; box-sizing: border-box; outline: none; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 15px; }
    button { height: 60px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; }
    .btn-num { background: #333; color: white; }
    .btn-num:active { background: #2cfc02; }
    .btn-op { background: #ff9f0a; color: white; }
    .btn-op:active { background: #c67c00; }
    .btn-func { background: #df0202; color: black; }
    .btn-zero { grid-column: span 2; border-radius: 30px; text-align: left; padding-left: 24px; }
</style>
</head>
<body>
<div class="calc">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="btn-func" onclick="clearAll()">AC</button>
        <button class="btn-func" onclick="deleteOne()">⌫</button>
        <button class="btn-op" onclick="append('/')">÷</button>

        <button class="btn-num" onclick="append('7')">7</button>
        <button class="btn-num" onclick="append('8')">8</button>
        <button class="btn-num" onclick="append('9')">9</button>
        <button class="btn-op" onclick="append('*')">×</button>

        <button class="btn-num" onclick="append('4')">4</button>
        <button class="btn-num" onclick="append('5')">5</button>
        <button class="btn-num" onclick="append('6')">6</button>
        <button class="btn-op" onclick="append('-')">−</button>

        <button class="btn-num" onclick="append('1')">1</button>
        <button class="btn-num" onclick="append('2')">2</button>
        <button class="btn-num" onclick="append('3')">3</button>
        <button class="btn-op" onclick="append('+')">+</button>

        <button class="btn-num btn-zero" onclick="append('0')">0</button>
        <button class="btn-num" onclick="append('.')">.</button>
        <button class="btn-op" onclick="calculate()">=</button>
    </div>
</div>
<script>
    let display = document.getElementById("display");

    // Add number/operator to display
    function append(value) {
        display.value += value;
    }

    // Clear all (AC)
    function clearAll() {
        display.value = "";
    }

    // Delete one character (⌫)
    function deleteOne() {
        display.value = display.value.slice(0, -1);
    }

    // Calculate correctly
    function calculate() {
        try {
            // Replace ÷ and × symbols if needed and evaluate safely
            let result = eval(display.value);
            // Check if result is valid
            if (isNaN(result) || !isFinite(result)) {
                display.value = "Error";
            } 
            else {
                display.value = result;
            }
        } catch (e) {
            display.value = "Error";
        }
    }
</script>
</body>
</html>
